models:
  - name: stg_stripe__payments
    description: This model processes and transforms raw payment data from Stripe, providing a structured view of payment transactions. It includes details such as payment methods, statuses, and amounts, facilitating analysis of payment trends and performance.
    columns:
      - name: payment_id
        description: primary key
        data_tests:
          - unique
          - not_null
          
      - name: order_id
        description: foreign key
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_jaffle_shop__orders')
                field: order_id

      - name: payment_method
        description: "{{ doc('payment_method') }}"
        data_tests:
          - accepted_values:
              arguments: 
                values:
                  - bank_transfer
                  - coupon
                  - gift_card
                  - credit_card
                  - debit_card
                  - pix

      - name: payment_status
        description: "{{ doc('payment_status') }}"
        data_tests:
          - accepted_values:
              arguments: 
                values:
                  - fail
                  - success
            
      - name: payment_amount
        description: Total amount of the payment transaction, converted to a standard currency unit.
      - name: payment_created
        description: Date when the payment was created.
      - name: _batched_at
        description: Timestamp indicating when the data was last batched.