models:
  - name: stg_stripe__payments
    columns:
      - name: payment_id
        description: primary key
        data_tests:
          - unique
          - not_null
          
      - name: order_id
        description: foreign key
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_jaffle_shop__orders')
                field: order_id

      - name: payment_method
        description: Payment Method Used
        data_tests:
          - accepted_values:
              arguments: 
                values:
                  - bank_transfer
                  - coupon
                  - gift_card
                  - credit_card
                  - debit_card
                  - pix

      - name: payment_status
        description: Payment Status 
        data_tests:
          - accepted_values:
              arguments: 
                values:
                  - fail
                  - success
            