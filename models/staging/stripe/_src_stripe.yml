sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment
        description: Replica Payment raw table from Snowflake 
        columns:
          - name: id
            description: primary key
            data_tests:
              - not_null
              - unique
          
          - name: orderid
            description: Order Id
            data_tests:
              - not_null

          - name: paymentmethod
            description: Payment Method Used
            data_tests:
              - accepted_values:
                  arguments: 
                    values:
                      - bank_transfer
                      - coupon
                      - gift_card
                      - credit_card
                      - debit_card
                      - pix
        
          - name: status
            description: Payment Status 
            data_tests:
              - accepted_values:
                  arguments: 
                    values:
                      - fail
                      - success
        config: 
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 1
              period: day
          loaded_at_field: _batched_at